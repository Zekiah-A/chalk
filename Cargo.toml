[package]
name = "chalk"
version = "0.2.0"
edition = "2024"
description = "Blackboard, without the friction."
repository = "https://github.com/Zekiah-A/chalk"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["blackboard", "cli", "education", "mcp", "students"]

[dependencies]
anyhow = "1"
console = "0.16"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
html2md = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"
termimad = "0.35"

